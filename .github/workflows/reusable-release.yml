name: "Reusable GitHub Release"

on:
  workflow_call:
    inputs:
      tag-name:
        description: "Release Git tag name (e.g. v1.0.0)"
        required: true
        type: string
      generate-notes:
        description: "Automatically generate release changelog notes"
        required: false
        type: boolean
        default: true
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag-name }}
          name: ${{ inputs.tag-name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: ${{ inputs.generate-notes }}
