name: "Setup Python with uv"
description: "Installs uv, sets up Python version, and configures uv dependency caching"
inputs:
  python-version:
    description: "Target Python version to install"
    required: false
    default: "3.14"
  enable-cache:
    description: "Enable automatic uv cache persistence across CI runs"
    required: false
    default: "true"
  sync-deps:
    description: "Automatically run 'uv sync --frozen' if lockfile exists"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: ${{ inputs.enable-cache == 'true' }}

    - name: Set up Python
      shell: bash
      run: |
        uv python install "${{ inputs.python-version }}"
        uv python pin "${{ inputs.python-version }}"

    - name: Synchronize dependencies
      if: inputs.sync-deps == 'true'
      shell: bash
      run: |
        if [ -f "uv.lock" ]; then
          uv sync --frozen
        else
          uv sync
        fi
